<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AuditFlux SEO</title>
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="stylesheet" href="shared/theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>

<header class="appbar">
  <div class="brand">
    <img class="brand-mark" src="icons/icon-48.png" alt="" width="32" height="32">
    <div class="brand-text">
      <strong>AuditFlux SEO</strong>
      <span id="pageHost">Analyzing…</span>
    </div>
  </div>
  <div class="appbar-actions">
    <button class="btn btn-dark btn-sm" id="planBadge" title="View plans">FREE</button>
    <button class="btn btn-dark btn-sm" id="overlayBtn" aria-pressed="false" title="Tag every heading on the page">H1–H6</button>
    <button class="btn btn-dark btn-sm" id="rescanBtn" title="Run the audit again">Re-scan</button>
    <button class="btn btn-primary btn-sm" id="dashboardBtn">Full report</button>
  </div>
</header>

<section id="loadingState" class="state">
  <div class="spinner" role="status" aria-label="Analyzing page"></div>
  <h2>Analyzing this page</h2>
  <p>Reading the page, response headers, robots.txt and sitemaps.</p>
</section>

<section id="errorState" class="state hidden">
  <div class="empty">
    <div class="icon" aria-hidden="true">!</div>
    <b id="errorTitle">This page can't be audited</b>
    <p id="errorBody">Open a normal website and try again.</p>
    <button class="btn btn-primary" id="errorRetry" style="margin-top:14px">Try again</button>
  </div>
</section>

<main id="results" class="hidden">
  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab active" data-tab="overview" role="tab" aria-selected="true">Overview</button>
    <button class="tab" data-tab="issues" role="tab" aria-selected="false">Issues <em id="tabIssueCount"></em></button>
    <button class="tab" data-tab="actions" role="tab" aria-selected="false">Quick actions</button>
  </nav>
  <div class="panel" id="panel" role="tabpanel"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config/plans.js"></script>
<script src="engine/provenance.js"></script>
<script src="engine/entitlements.js"></script>
<script src="engine/pagespeed.js"></script>
<script src="engine/backend-client.js"></script>
<script src="engine/audit-contract.js"></script>
<script src="engine/psi-cache.js"></script>
<script src="engine/analyzer.js"></script>
<script src="engine/rules.js"></script>
<script src="engine/report.js"></script>
<script src="content/overlay.js"></script>
<script src="popup.js"></script>
</body>
</html>
